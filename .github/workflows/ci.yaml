# Basic CI setup: Lint with ruff, run tests with pytest
name: Run Continous Integration

on:
  pull_request:
  push:
    branches:
      - main

jobs:

  lint:
    name: Lint and Format
    
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
    
      - uses: astral-sh/setup-uv@v3

      - name: Install the project
        run: uv sync --all-extras --dev
    
      - name: Ruff lint
        run: uv run ruff check . --fix
    
      - name: Ruff format
        run: uv run ruff format  .

      - name: Run Type Chekcs
        run: uv run ty check


  matrix:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.set.outputs.python }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - id: set
        run: |
          echo "python=$(uv run python scripts/python_matrix.py)" >> $GITHUB_OUTPUT


  test:
    needs: matrix
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ${{ fromJSON(needs.matrix.outputs.python) }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - name: Set Python
        run: uv python install ${{ matrix.python-version }}

      - name: Sync environment
        run: uv sync --all-extras --dev

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest

      - name: Build
        run: uv build --python ${{ matrix.python-version }} --no-sources
